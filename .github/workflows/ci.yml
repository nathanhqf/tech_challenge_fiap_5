name: CI

on:
  push:
    paths: ["src/**", "scripts/**"]
  pull_request:
    paths: ["src/**", "scripts/**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ scripts/

      - name: Type check
        run: mypy src/datathon_offerexp/ --ignore-missing-imports

      - name: Security
        run: bandit -r src/datathon_offerexp/ -c pyproject.toml

      - name: Tests
        run: |
          pytest src/tests/ \
            --cov=src/datathon_offerexp \
            --cov-report=xml \
            --cov-fail-under=60 \
            --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "*.xml"
